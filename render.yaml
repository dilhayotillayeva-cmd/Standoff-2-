# Render.com Blueprint.
# DIQQAT: doimiy disk (disk:) faqat pullik rejada (starter va yuqori) mavjud.
# Bepul rejada disk yo'q - u holda `disk:` blokini va DB_PATH ni olib tashlab,
# DATABASE_URL ga tashqi PostgreSQL (masalan Neon/Supabase) manzilini kiriting.
services:
  - type: web
    name: standoff2-settings-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    disk:
      name: bot-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: WEBHOOK_BASE        # bo'sh qoldirsa RENDER_EXTERNAL_URL ishlatiladi
        sync: false
      - key: DB_PATH
        value: /data/bot.db
